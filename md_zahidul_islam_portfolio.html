<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Md Zahidul Islam — Graphic Designer, Web Developer, SEO and Digital Marketing Expert.">
<title>Md Zahidul Islam | Creative Digital Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--p:#2A9D8F;--s:#264653;--bg:#071216;--card:rgba(255,255,255,.065)}
*{box-sizing:border-box;scroll-behavior:smooth}body{margin:0;font-family:"DM Sans",sans-serif;background:radial-gradient(circle at 80% 10%,rgba(42,157,143,.2),transparent 28%),var(--bg);color:#edf7f5}a{text-decoration:none}.glass{background:var(--card);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.2)}.grad{background:linear-gradient(100deg,#fff,var(--p));-webkit-background-clip:text;color:transparent}.btn{display:inline-flex;gap:10px;align-items:center;padding:13px 20px;border-radius:999px;background:linear-gradient(100deg,var(--p),#58d0bd);color:#06201d;font-weight:800;transition:.3s}.btn:hover{transform:translateY(-3px);box-shadow:0 12px 35px #2a9d8f55}.reveal{opacity:0;transform:translateY(28px);transition:.8s}.reveal.show{opacity:1;transform:none}.project{overflow:hidden}.project img{transition:transform 1s}.project:hover img{transform:translateY(-18%)}.blob{animation:float 6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-18px) rotate(4deg)}}.typing{border-right:2px solid var(--p);white-space:nowrap;overflow:hidden}@media(max-width:700px){.typing{white-space:normal;border:0}.hero{padding-top:100px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== EDIT ONLY THIS DATA ===================== */
const DATA={
name:"Md Zahidul Islam", email:"zahidroton567@gmail.com", location:"Kushtia, Dhaka, Bangladesh",
started:"March 2021", experience:"6+ Years", projects:"25+", education:"National University, Bangladesh",
profileImage:"https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=800&q=85",
social:{facebook:"#",linkedin:"#",github:"#",instagram:"#"},
services:[
["Graphic Design","Logo, brand identity, social media, banners and visual communication.","fa-pen-nib"],
["Web Development","Responsive, modern and user-friendly websites built for real business needs.","fa-code"],
["SEO","On-page, off-page and technical optimization for stronger organic visibility.","fa-magnifying-glass-chart"],
["Digital Marketing","Social media strategy, content planning and performance-focused campaigns.","fa-bullhorn"]],
portfolio:Array.from({length:20},(_,i)=>({title:["Brand Identity","Modern Landing Page","SEO Dashboard","Social Media Design","Business Website"][i%5]+" Project "+(i+1),image:`https://picsum.photos/seed/zahid-${i+1}/1000/700`,link:"#"})),
testimonials:["Professional, creative and focused on results.","Excellent communication and polished design.","A complete digital solution from design to marketing."],
telegramBotApi:"",googleScriptApi:"",googleMapLink:"https://www.google.com/maps?q=Kushtia,Bangladesh"
};
/* ===================== SITE RENDER ===================== */
const serviceHTML=DATA.services.map(s=>`<div class="glass rounded-3xl p-7 reveal hover:-translate-y-2 transition"><div class="text-3xl text-[#2A9D8F] mb-5"><i class="fa-solid ${s[2]}"></i></div><h3 class="text-xl font-bold">${s[0]}</h3><p class="text-slate-300 mt-3 leading-7">${s[1]}</p></div>`).join("");
const portfolioHTML=DATA.portfolio.map(p=>`<article class="project glass rounded-3xl reveal"><div class="h-64 overflow-hidden"><img src="${p.image}" class="w-full h-[150%] object-cover" alt="${p.title}"></div><div class="p-5 flex justify-between gap-3"><div><h3 class="font-bold">${p.title}</h3><p class="text-slate-400 text-sm mt-1">Creative digital project</p></div><a class="btn !p-3" href="${p.link}"><i class="fa-solid fa-arrow-up-right-from-square"></i></a></div></article>`).join("");
document.querySelector("#app").innerHTML=`
<header class="fixed top-0 z-50 w-full"><nav class="max-w-7xl mx-auto px-5 py-4"><div class="glass rounded-full px-5 py-3 flex items-center justify-between"><a href="#home" class="font-extrabold text-lg"><span class="text-[#2A9D8F]">MZ</span> ${DATA.name}</a><div id="nav" class="hidden md:flex gap-6 text-sm font-semibold"><a href="#home">Home</a><a href="#service">Service</a><a href="#portfolio">Portfolio</a><a href="#about">About</a><a class="text-[#2A9D8F]" href="#contact">Hire Me</a></div><button id="menu" class="md:hidden text-xl"><i class="fa-solid fa-bars"></i></button></div></nav></header>
<main>
<section id="home" class="hero min-h-screen flex items-center pt-24"><div class="max-w-7xl mx-auto px-5 grid md:grid-cols-2 gap-12 items-center"><div class="reveal"><p class="text-[#2A9D8F] font-bold mb-4">HELLO, I’M ${DATA.name.toUpperCase()}</p><h1 class="text-5xl md:text-7xl font-extrabold leading-tight">Building <span class="grad">brands, websites & growth</span> that stand out.</h1><p class="typing mt-7 text-xl text-slate-300">Graphic Designer • Web Developer • SEO Expert • Digital Marketer</p><div class="mt-8 flex flex-wrap gap-4"><a class="btn" href="#contact">Hire Me <i class="fa-solid fa-arrow-right"></i></a><a class="glass rounded-full px-6 py-3 font-bold" href="#portfolio">View Portfolio</a></div><div class="flex gap-5 mt-8 text-xl"><a href="${DATA.social.facebook}"><i class="fa-brands fa-facebook"></i></a><a href="${DATA.social.linkedin}"><i class="fa-brands fa-linkedin"></i></a><a href="${DATA.social.github}"><i class="fa-brands fa-github"></i></a><a href="${DATA.social.instagram}"><i class="fa-brands fa-instagram"></i></a></div></div><div class="relative reveal"><div class="blob absolute inset-0 rounded-full bg-[#2A9D8F33] blur-3xl"></div><img src="${DATA.profileImage}" alt="${DATA.name}" class="relative w-72 h-72 md:w-96 md:h-96 object-cover rounded-[35%] mx-auto border border-white/10 shadow-2xl"></div></div></section>
<section id="service" class="py-24"><div class="max-w-7xl mx-auto px-5"><div class="reveal mb-12"><p class="text-[#2A9D8F] font-bold">WHAT I DO</p><h2 class="text-4xl md:text-5xl font-extrabold mt-2">Services built for <span class="grad">real growth.</span></h2></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">${serviceHTML}</div></div></section>
<section id="portfolio" class="py-24 bg-[#26465322]"><div class="max-w-7xl mx-auto px-5"><div class="reveal mb-12"><p class="text-[#2A9D8F] font-bold">SELECTED WORK</p><h2 class="text-4xl md:text-5xl font-extrabold mt-2">20 projects. <span class="grad">One standard.</span></h2></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">${portfolioHTML}</div></div></section>
<section id="about" class="py-24"><div class="max-w-5xl mx-auto px-5"><div class="glass rounded-[35px] p-8 md:p-12 reveal"><p class="text-[#2A9D8F] font-bold">ABOUT ME</p><h2 class="text-4xl md:text-5xl font-extrabold mt-2">A creative professional with a <span class="grad">digital-first mindset.</span></h2><p class="text-slate-300 leading-8 mt-7">I'm ${DATA.name}, a professional Graphic Designer, Web Developer, and SEO & Digital Marketing Expert based in Bangladesh. Alongside my studies at ${DATA.education}, I have been working professionally since ${DATA.started}.</p><p class="text-slate-300 leading-8 mt-4">With ${DATA.experience} of experience and ${DATA.projects} completed projects, I combine design, web presence and marketing strategy to create meaningful business impact.</p><div class="grid grid-cols-3 gap-4 mt-8 text-center"><div><b class="text-3xl text-[#2A9D8F]">${DATA.experience}</b><p class="text-sm text-slate-400">Experience</p></div><div><b class="text-3xl text-[#2A9D8F]">${DATA.projects}</b><p class="text-sm text-slate-400">Projects</p></div><div><b class="text-3xl text-[#2A9D8F]">4</b><p class="text-sm text-slate-400">Core Skills</p></div></div></div></div></section>
<section id="contact" class="py-24"><div class="max-w-6xl mx-auto px-5 grid md:grid-cols-2 gap-8"><div class="reveal"><p class="text-[#2A9D8F] font-bold">LET’S WORK TOGETHER</p><h2 class="text-5xl font-extrabold mt-2">Have a project? <span class="grad">Let’s talk.</span></h2><p class="text-slate-300 mt-6 leading-7">Tell me about your goals and I’ll help turn the idea into a professional digital experience.</p><div class="mt-7 space-y-3 text-slate-300"><p><i class="fa-solid fa-envelope text-[#2A9D8F] w-7"></i>${DATA.email}</p><p><i class="fa-solid fa-location-dot text-[#2A9D8F] w-7"></i>${DATA.location}</p></div></div><form id="contactForm" class="glass rounded-3xl p-7 reveal"><div class="grid sm:grid-cols-2 gap-4"><input required name="firstName" placeholder="First Name" class="bg-white/5 rounded-xl p-4 outline-none"><input required name="lastName" placeholder="Last Name" class="bg-white/5 rounded-xl p-4 outline-none"></div><input required type="email" name="email" placeholder="Email" class="bg-white/5 rounded-xl p-4 outline-none w-full mt-4"><textarea required name="message" rows="6" placeholder="Message" class="bg-white/5 rounded-xl p-4 outline-none w-full mt-4"></textarea><button class="btn mt-4 w-full justify-center">Send Message <i class="fa-solid fa-paper-plane"></i></button><p id="status" class="text-sm text-[#2A9D8F] mt-3"></p></form></div></section>
<section class="h-80"><iframe title="Kushtia Map" src="${DATA.googleMapLink}&output=embed" class="w-full h-full border-0 grayscale opacity-70"></iframe></section>
</main><footer class="py-8 text-center text-slate-400 border-t border-white/10">© ${new Date().getFullYear()} ${DATA.name}. All rights reserved.</footer>`;
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("show")}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>obs.observe(e));
document.querySelector("#menu").onclick=()=>document.querySelector("#nav").classList.toggle("hidden");
document.querySelector("#contactForm").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target), status=document.querySelector("#status");if(!DATA.googleScriptApi){status.textContent="Demo mode: add your Google Apps Script URL in DATA.googleScriptApi.";return}try{await fetch(DATA.googleScriptApi,{method:"POST",body:f,mode:"no-cors"});status.textContent="Thanks! Your message has been sent.";e.target.reset()}catch{status.textContent="Could not send. Please check the API URL."}};
</script></body></html>
