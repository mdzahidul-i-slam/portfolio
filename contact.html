<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Md Zahidul Islam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo" aria-label="Md Zahidul Islam — Home">
      <span class="logo-dot"></span>
    </a>
    <nav class="main-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <a href="contact.html" class="btn btn-primary btn-small">Hire Me</a>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1>Get in Touch</h1>
  </div>
</section>

<section class="page-content">
  <form class="contact-form" onsubmit="alert('This form needs a backend (e.g. Formspree) to actually send messages.'); return false;">
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Send message</button>
  </form>
</section>

<footer class="site-footer">
  <div class="container">
    <p>&copy; <span id="year"></span> Md Zahidul Islam. All rights reserved.</p>
  </div>
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
